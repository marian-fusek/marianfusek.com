<!doctype html>
<html lang="en" class="font-nollie">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page Not Found — Marian Fusek</title>
  <link rel="canonical" href="https://marianfusek.com/">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" sizes="512x512" type="image/png" href="/favicon/favicon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="icon" type="image/png" href="favicon/favicon.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <nav class="site-nav" aria-label="Primary">
    <a class="nav-logo" href="https://www.marianfusek.com" aria-label="Marian Fusek">MF ⎯ ©’26</a>
  </nav>

  <main>
    <section class="hero" id="hero">
      <div class="hero-info">
        <h1 class="hero-copy">
          <span>Nothing here</span>
        </h1>
      </div>
      <a class="hero-recent-cue" href="https://www.marianfusek.com"><span class="hero-recent-cue-arrow" aria-hidden="true">→</span><span class="hero-recent-cue-label">Get Me Home</span></a>

      <div class="hero-name-wrap is-expanded" id="heroNameWrap">
        <div class="hero-name" id="heroName">404</div>
      </div>
    </section>
  </main>

  <div class="cursor" id="cursor" aria-hidden="true">
    <span class="cursor-dot"></span>
  </div>

  <script>
    (()=>{
      const hasHover=()=>matchMedia('(hover: hover) and (pointer: fine)').matches;
      const nameWrap=document.getElementById('heroNameWrap');
      const name=document.getElementById('heroName');
      const heroInfo=document.querySelector('.hero-info');
      const alignHeroNameToInfo=()=>{
        if(!heroInfo||!name||!nameWrap)return;
        const offset=heroInfo.getBoundingClientRect().top-nameWrap.getBoundingClientRect().top;
        name.style.top=`${offset}px`;
      };
      addEventListener('resize',alignHeroNameToInfo,{passive:true});
      requestAnimationFrame(alignHeroNameToInfo);
      document.fonts?.ready?.then(alignHeroNameToInfo);

      const cursor=document.getElementById('cursor');
      if(cursor&&hasHover()){
        addEventListener('pointermove',event=>{
          cursor.style.transform=`translate3d(${event.clientX}px, ${event.clientY}px, 0)`;
        },{passive:true});
      }
    })();
  </script>
</body>
</html>
