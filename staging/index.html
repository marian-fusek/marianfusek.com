<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Marian Fusek — Staging V181</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <nav class="site-nav" aria-label="Primary">
    <a class="nav-logo" href="#hero">MF</a>
    <a href="#projects">Index</a>
    <a href="#guidance">Guidance</a>
    <a href="#xp">XP</a>
    <a href="#bio">BIO</a>
    <a href="#art">ART</a>
    <a href="#contact">Attack Me</a>
  </nav>

  <main>
    <section class="hero" id="hero">
      <div class="hero-info">
        <h1 class="hero-copy">
          <span>Brand, UI, AI &amp; Visual Designer</span>
          <span>Creative Director</span>
          <span>Mindset Coach for Digital Creatives</span>
        </h1>
        <div class="hero-meta" aria-live="polite">
          <span id="heroTypewriter"></span><span class="type-cursor">_</span>
        </div>
      </div>

      <div class="hero-name" id="heroName" aria-label="Marian Fusek">
        <span class="name-letter">M</span><span class="name-letter">A</span><span class="name-letter">R</span><span class="name-letter">I</span><span class="name-letter" data-accent="Á">A</span><span class="name-letter">N</span><span class="name-space">&nbsp;</span><span class="name-letter">F</span><span class="name-letter" data-accent="Ů">U</span><span class="name-letter">S</span><span class="name-letter">E</span><span class="name-letter">K</span>
      </div>
    </section>

    <section class="projects" id="projects">
      <div class="projects-sticky">
        <header class="projects-heading" id="projectsHeading">
          <h2 data-reveal="words">Recent Works</h2>
        </header>

        <div class="projects-menu" id="projectsMenu">
          <button class="project-row" data-project="0" type="button">
            <span class="project-title">MIUNĀE</span>
            <span class="project-meta">CREATIVE DIRECTION</span>
          </button>
          <button class="project-row" data-project="1" type="button">
            <span class="project-title">GoBaller</span>
            <span class="project-meta">BRAND, iOS APP</span>
          </button>
          <button class="project-row" data-project="2" type="button">
            <span class="project-title">AIMS</span>
            <span class="project-meta">WEBSITE, BRAND REFRESH</span>
          </button>
          <button class="project-row" data-project="3" type="button">
            <span class="project-title">Explorations</span>
            <span class="project-meta">DESIGN EXPERIMENTS</span>
          </button>
        </div>

        <div class="project-previews" id="projectPreviews" aria-live="polite">
          <figure class="project-preview" data-project="0"><img src="../media/projects/miunae/01-miunae-logo.jpg" alt="MIUNĀE project preview"></figure>
          <figure class="project-preview" data-project="1"><img src="../media/projects/goballer/01-goballer-logo.jpg" alt="GoBaller project preview"></figure>
          <figure class="project-preview" data-project="2"><img src="../media/projects/aims/01-aims-logo.jpg" alt="AIMS project preview"></figure>
          <figure class="project-preview" data-project="3"><img src="../media/projects/vault/01-nofakie-1.jpg" alt="Explorations project preview"></figure>
        </div>
      </div>
    </section>

    <section class="after-projects" aria-hidden="true"></section>
  </main>

  <div class="cursor" id="cursor" aria-hidden="true">
    <span class="cursor-dot"></span>
    <span class="cursor-label">OPEN</span>
  </div>

  <script src="./script.js"></script>
</body>
</html>
